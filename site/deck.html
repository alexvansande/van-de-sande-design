<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="dark">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sheets — experiment</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=Crimson+Pro:ital,wght@0,400;1,400&family=Cardo:wght@400;700&family=Caveat:wght@600&display=swap" rel="stylesheet">
<style>
:root{
  --night:#15120c;          /* the dark the sheets float in */
  --paper:#f7f1de;
  --ink:#262420;
  --ghost:#8c8674;
  --pen:#2b4d86;
  --edge:247,241,222;       /* the sheets further out, as rgb parts */
  color-scheme:dark;
  box-sizing:border-box;
}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
body{margin:0;background:var(--night);color:var(--ink);
  font-family:"EB Garamond",Garamond,Georgia,serif;-webkit-font-smoothing:antialiased}

/* ---------- the stage ----------
   A4 is 1 to root 2, so the sheet is sized by its height and the width
   follows. The three candidates keep it inside the window whichever way
   the window happens to be. */
.stage{position:fixed;inset:0;overflow:hidden;
  --sh:min(76vh, 44rem, 88vw / 0.7071);
  --sw:calc(var(--sh) * 0.7071);
  --gap:26px;               /* sideways step between stories; JS owns it */
  --drop:11px;              /* downward step between pages of one story */
  touch-action:none;user-select:none;-webkit-user-select:none;
  -webkit-tap-highlight-color:transparent}

/* the stories past the ones you can still make out */
.more{position:absolute;top:50%;translate:0 -50%;
  left:calc(50% + var(--sw)/2 + var(--gap)*4.6);
  right:0;height:calc(var(--sh) * .86);
  display:flex;gap:var(--gap);pointer-events:none}
.more b{display:block;width:1px;height:100%;flex:none;
  background:linear-gradient(180deg,
    rgba(var(--edge),0) 0%, rgba(var(--edge),.55) 18%,
    rgba(var(--edge),.55) 82%, rgba(var(--edge),0) 100%)}

/* ---------- a story: one pad of sheets ---------- */
.deck{position:absolute;inset:0}
.story{position:absolute;top:50%;left:50%;
  width:var(--sw);height:var(--sh);
  margin-top:calc(var(--sh) / -2);margin-left:calc(var(--sw) / -2);
  perspective:1800px;perspective-origin:50% 38%;
  will-change:transform,opacity}
.story.gone{visibility:hidden}

/* ---------- a sheet, hinged along its top edge ---------- */
.sheet{position:absolute;inset:0;transform-origin:50% 0;
  transform-style:preserve-3d;will-change:transform,opacity}
.sheet.gone{visibility:hidden}
.face,.back{position:absolute;inset:0;border-radius:2px;background:var(--paper);
  backface-visibility:hidden;-webkit-backface-visibility:hidden;
  box-shadow:0 26px 60px -28px rgba(0,0,0,.85), 0 3px 10px -4px rgba(0,0,0,.5)}
.face{display:flex;flex-direction:column;overflow:hidden;
  padding:clamp(1.5rem,4vh,2.5rem) clamp(1.3rem,3.6vw,2.1rem)}
/* the underside of a sheet: the same paper, no ink, a little in shadow */
.back{transform:rotateX(180deg);filter:brightness(.93)}

/* ---------- what is printed on one ---------- */
.run{display:flex;justify-content:space-between;gap:1rem;flex:none;
  font-size:.6rem;font-weight:500;letter-spacing:.24em;color:var(--ghost);
  margin:0 0 clamp(1rem,3vh,1.7rem)}
.body{flex:1;min-height:0;overflow:hidden}
.body p{margin:0;font-size:calc(clamp(.82rem,.72rem + .42vw,1.06rem) * var(--fit,1));line-height:1.44;
  text-indent:1.4em;text-align:justify;hyphens:auto}
.body p:first-child{text-indent:0}
.folio{flex:none;font-size:.8rem;font-weight:500;color:var(--ghost);padding-top:.8rem}

.cryp .body p{font-family:"Crimson Pro",Georgia,serif;text-indent:1.3em}
.ether .body{font-family:"Cardo",Georgia,serif}
.ether .body p{text-align:left;text-indent:-1.3em;padding-left:1.3em;margin:0 0 .3em;
  hyphens:none;font-size:calc(clamp(.76rem,.68rem + .34vw,.95rem) * var(--fit,1))}
.ether .body h4{font-weight:700;font-size:calc(.86rem * var(--fit,1));margin:1em 0 .5em}

/* the marker, the same two passes as the book */
.hl{color:inherit;background-color:transparent;
  background-image:
    linear-gradient(101deg,
      rgba(246,206,49,0) .3%, rgba(246,206,49,.78) 1.8%,
      rgba(246,206,49,.78) 97.4%, rgba(246,206,49,0) 99.5%),
    linear-gradient(179.4deg,
      rgba(243,196,26,0) 16%, rgba(243,196,26,.38) 16%,
      rgba(243,196,26,.38) 86%, rgba(243,196,26,0) 86%);
  padding:.06em .16em;margin:0 -.12em;
  box-decoration-break:clone;-webkit-box-decoration-break:clone}

/* ---------- a sheet that is only a title ---------- */
.face.cover{justify-content:center}
.cover h2{margin:0;font-weight:400;line-height:1.02;letter-spacing:-.015em;
  font-size:clamp(1.7rem,1.3rem + 2vw,2.7rem)}
.cover .sub{margin:.85rem 0 0;font-family:"Caveat",cursive;font-weight:600;
  color:var(--pen);line-height:1.15;transform:rotate(-1.4deg);transform-origin:left;
  font-size:clamp(1.05rem,.9rem + .7vw,1.45rem)}
.face.plain{justify-content:center}
.plain h3{margin:0 0 .9rem;font-weight:400;line-height:1.1;
  font-size:clamp(1.2rem,1rem + 1vw,1.7rem)}
.plain p{margin:0 0 .7rem;font-size:clamp(.88rem,.8rem + .4vw,1.05rem);line-height:1.5}
.plain .todo{color:var(--ghost);font-style:italic}
</style>
</head>
<body>
<main class="stage" id="stage" tabindex="-1" aria-label="Sheets">
  <div class="more" id="more" aria-hidden="true"></div>
  <div class="deck" id="deck"></div>
</main>

<script>
(() => {
'use strict';

/* ===================================================================
   An experiment, not the site. A4 sheets floating in the dark.

   Two directions, and both of them are shown rather than captioned:
     sideways   the next story, and the one after it, stepped off to the right
     upwards    the next page of this story, its edge showing below this one

   Sliding sideways moves between stories. Sliding the top sheet up flips it
   over its own top edge, the way a page comes off a pad, and the page under
   it was already there.
   =================================================================== */

const STORIES = [
  { pages: [
      { kind: 'book', run: ['THE INFINITE MACHINE', 'CAMILA RUSSO'], folio: '190',
        body: `<p>&ldquo;Honey, remember that giant pile of money I was talking about last week? The one kept safe by unhackable code?&rdquo; <mark class="hl">Alex</mark>, still glued to his smartphone screen, said to his wife.</p>
               <p>&ldquo;Yes?&rdquo;</p>
               <p>&ldquo;Well, it was hacked.&rdquo;</p>` },
      { kind: 'book', cls: 'cryp', run: ['THE CRYPTOPIANS', 'LAURA SHIN'], folio: '79',
        body: `<p>Jeff was also funny. He played the grumpy guy but was actually a teddy bear. He often teased and screwed around with people, but it was obvious he was joking. He was a boss who didn&rsquo;t want to be a boss. Plus, he was always accessible. He was logged onto Gitter, on a public Go Ethereum channel, all day long, which was nice for his remote team members, such as the black-, curly-haired P&eacute;ter Szil&aacute;gyi in Transylvania and <mark class="hl">Alex van de Sande, aka Avsa, a designer in Rio de Janeiro whose high forehead and disheveled locks gave him a professorial vibe. Everyone felt part of the team.</mark></p>
               <p>Those under Gavin had a different experience. If a few developers came up with an idea, he would sometimes immediately shoot it down. Often he was right, but still, it was frustrating to work with someone who was constantly telling you that you were wrong. <mark class="hl">Once, when Avsa was in Amsterdam from Rio, working with Jeff, the second Gav heard he was there, he immediately asked Alex to take a train to Zug to work with him.</mark></p>
               <p>As time went on, however, his employees found Gavin became more of an &ldquo;ideas guy&rdquo; who made his underlings execute his vision, while claiming credit and never praising them. Still, they found him &ldquo;brilliant&rdquo; or thought him &ldquo;a smart guy, but not the best boss.&rdquo;</p>` },
      { kind: 'book', cls: 'ether', run: ['OUT OF THE ETHER', 'MATT LEISING'], folio: 'x',
        body: `<p>Ming Chan &ndash; First executive director of the Ethereum Foundation, whipped it into shape to keep it within its means, Vitalik favored her though she rubbed many the wrong way</p>
               <h4>Badass blockchain ninja warriors</h4>
               <p><mark class="hl">Alex Van de Sande &ndash; Known as avsa, helped marshal the Robin Hood Group from his apartment in Rio, co-developed the Mist wallet, excellent husband, the one who pushed the button to start the DAO counterattack</mark></p>
               <p>Griff Green &ndash; The Mayor of Ethereum circa June 2016, hugger, visionary, driver of the RHG, slock.it&rsquo;s first employee</p>
               <p>Fabian Vogelsteller &ndash; tech whiz who helped the RHG prepare to fight the ether thief, co-developed Mist wallet</p>
               <p>Lefteris Karapetsas &ndash; coding guru, replicated DAO attack in a few hours</p>` }
    ] },
  { pages: [
      { kind: 'cover', title: 'Bend', sub: 'what happens when you stop assuming the surface is flat' },
      { kind: 'plain', title: 'Straight lines are a decision',
        paras: ['<span class="todo">the opening image goes here, and the argument under it</span>'] }
    ] },
  { pages: [
      { kind: 'cover', title: 'The triangle of everything', sub: 'three corners, and everything sits somewhere between them' },
      { kind: 'plain', title: 'Why three',
        paras: ['Two things make a slider and people pick an end. Three make a space, and you have to admit where you actually are.',
                '<span class="todo">name the three corners</span>'] }
    ] },
  { pages: [
      { kind: 'cover', title: 'Hexagonal earth', sub: 'the whole planet, cut into sevens' },
      { kind: 'plain', title: 'An equal-area world',
        paras: ['A hexagon splits into seven hexagons, each turned about 19 degrees and smaller by root 7. Do it twice and you have forty-nine.',
                '<span class="todo">the projection, and the migration routes over ten thousand years</span>'] }
    ] },
  { pages: [
      { kind: 'cover', title: 'Blog', sub: 'shorter things, in no particular order' },
      { kind: 'plain', title: 'Recent',
        paras: ['<span class="todo">point this at wherever the writing actually lives</span>'] }
    ] }
];

const $ = s => document.querySelector(s);
const clamp = (x, a, b) => x < a ? a : x > b ? b : x;
const clamp01 = x => clamp(x, 0, 1);
const stage = $('#stage'), deck = $('#deck');

$('#more').innerHTML = [.9, .62, .4, .24].map(o => `<b style="opacity:${o}"></b>`).join('');

/* ---------- build ---------- */
function faceHTML(p){
  if (p.kind === 'cover')
    return `<div class="face cover"><h2>${p.title}</h2><p class="sub">${p.sub}</p></div>`;
  if (p.kind === 'plain')
    return `<div class="face plain"><h3>${p.title}</h3>${p.paras.map(x => `<p>${x}</p>`).join('')}</div>`;
  return `<div class="face ${p.cls || ''}">
    <header class="run"><span>${p.run[0]}</span><span>${p.run[1]}</span></header>
    <div class="body">${p.body}</div>
    <footer class="folio">${p.folio}</footer></div>`;
}
STORIES.forEach(st => {
  const el = document.createElement('section');
  el.className = 'story';
  st.sheets = st.pages.map(p => {
    const sh = document.createElement('div');
    sh.className = 'sheet';
    sh.innerHTML = faceHTML(p) + '<div class="back"></div>';
    el.append(sh);
    return sh;
  });
  st.el = el;
  deck.append(el);
});

/* ===================================================================
   Two numbers. sx is the continuous story, sideways. py[i] is the continuous
   page of story i, upwards. A half on either one is a sheet caught halfway.
   A drag writes them, a spring catches them, and every sheet reads its own
   position off them, so there is nothing to keep in sync.
   =================================================================== */
const LASTS = STORIES.length - 1;
let sx = 0;
const py = STORIES.map(() => 0);

const W = () => stage.clientWidth, H = () => stage.clientHeight;
const TOSS = () => W() * 1.15;
const cssPx = (name, v) => { stage.style.setProperty(name, v + 'px'); return v; };
/* worked out here rather than in CSS: a custom property holding a clamp() comes
   back out of getComputedStyle unresolved, so anything parsing it gets NaN and
   every transform built from it is silently dropped */
const GAP  = () => cssPx('--gap',  Math.round(clamp(W() * .034, 15, 36)));
const DROP = () => cssPx('--drop', Math.round(clamp(H() * .014, 7, 16)));

/* A sheet is a fixed size and the text is whatever the book says. When a page
   runs long, step the type down until it lands — otherwise .face clips it and
   the clipped line shows in the strip of the sheet below, which is the one bit
   of paper that is meant to read as blank. */
function fitSheets(){
  STORIES.forEach(st => st.sheets.forEach(sh => {
    const body = sh.querySelector('.body');
    if (!body) return;
    const face = sh.querySelector('.face');
    let f = 1;
    face.style.setProperty('--fit', f);
    while (f > .62 && body.scrollHeight > body.clientHeight){
      f -= .03;
      face.style.setProperty('--fit', f.toFixed(3));
    }
  }));
}

function render(){
  const gap = GAP(), drop = DROP();
  STORIES.forEach((st, i) => {
    const d = i - sx;
    let tx = 0, ty = 0, rot = 0, sc = 1, op = 1, z = 100, br = 1;
    if (d <= 0){
      const t = clamp01(-d);
      if (-d > 1.02){ st.el.classList.add('gone'); return; }
      const ease = t * t;                                  /* it accelerates away */
      tx = ease * TOSS(); ty = ease * W() * .09; rot = t * 15;
      op = 1 - clamp01((t - .55) / .45) * .85;
    } else {
      const s = Math.min(d, 4);
      if (d > 3.6){ st.el.classList.add('gone'); return; }
      tx = s * gap; sc = 1 - s * .035;
      op = 1 - clamp01((s - 1) / 3) * .55;
      z = 100 - Math.round(s * 10);
      br = 1 - Math.min(s, 3) * .085;
    }
    st.el.classList.remove('gone');
    st.el.style.transform =
      `translate3d(${tx.toFixed(1)}px, ${ty.toFixed(1)}px, 0) rotate(${rot.toFixed(2)}deg) scale(${sc.toFixed(4)})`;
    st.el.style.opacity = op.toFixed(3);
    st.el.style.zIndex = z;
    st.el.style.filter = br === 1 ? '' : `brightness(${br.toFixed(3)})`;

    /* the pages of this story, hinged along the top */
    const p = py[i];
    st.sheets.forEach((sh, j) => {
      const f = clamp01(p - j);                  /* 0 flat on the pad, 1 flipped over */
      sh.style.zIndex = 50 - j;
      if (f > 0){
        if (p - j > 1.02){ sh.classList.add('gone'); return; }
        sh.classList.remove('gone');
        sh.style.transform = `rotateX(${(-172 * f).toFixed(2)}deg)`;
        sh.style.opacity = (1 - clamp01((f - .62) / .38)).toFixed(3);
      } else {
        const b = clamp(j - p, 0, 3);            /* how far down the pad it sits */
        sh.classList.toggle('gone', j - p > 3.4);
        sh.style.transform = `translate3d(0, ${(b * drop).toFixed(1)}px, 0) scale(${(1 - b * .012).toFixed(4)})`;
        sh.style.opacity = (1 - clamp01((b - 1) / 3) * .35).toFixed(3);
      }
    });
  });
}

/* ---------- the spring that catches what you let go of ---------- */
const STIFF = 210, DAMP = 29.5;
const AX = {
  story: { get: () => sx, set: v => { sx = v; }, lo: () => 0, hi: () => LASTS, give: .16 },
  page:  { i: 0,
           get(){ return py[this.i]; }, set(v){ py[this.i] = v; },
           lo: () => 0, hi(){ return STORIES[this.i].pages.length - 1; }, give: .14 }
};
let anim = null, raf = 0, last = 0;
function springTo(ax, target, v0){
  anim = { ax, target: clamp(target, ax.lo(), ax.hi()), v: v0 || 0 };
  if (!raf){ last = performance.now(); raf = requestAnimationFrame(tick); }
}
function tick(now){
  const dt = clamp((now - last) / 1000, .001, .032); last = now;
  const a = anim;
  if (!a){ raf = 0; return; }
  let x = a.ax.get();
  a.v += (-STIFF * (x - a.target) - DAMP * a.v) * dt;
  x += a.v * dt;
  if (Math.abs(x - a.target) < .0006 && Math.abs(a.v) < .02){
    a.ax.set(a.target); anim = null; raf = 0; render(); return;
  }
  a.ax.set(x); render();
  raf = requestAnimationFrame(tick);
}
function stop(){ anim = null; if (raf){ cancelAnimationFrame(raf); raf = 0; } }

const COMMIT = .32, CARRY = .2;
function settle(ax, v){
  const from = Math.round(ax.get()), proj = ax.get() + v * CARRY;
  const t = proj > from + COMMIT ? from + 1 : proj < from - COMMIT ? from - 1 : from;
  springTo(ax, t, v);
}
const RUB = (over, give) => (1 - 1 / (over / give * .55 + 1)) * give;
function bounded(ax, x){
  const lo = ax.lo(), hi = ax.hi();
  if (x < lo) return lo - RUB(lo - x, ax.give);
  if (x > hi) return hi + RUB(x - hi, ax.give);
  return x;
}
function pageAxis(){ AX.page.i = clamp(Math.round(sx), 0, LASTS); return AX.page; }

/* ---------- hand ---------- */
function speed(s){
  if (s.length < 2) return 0;
  const a = s[0], b = s[s.length - 1], dt = (b[0] - a[0]) / 1000;
  return dt > .008 ? clamp((b[1] - a[1]) / dt, -12, 12) : 0;
}
let g = null;
stage.addEventListener('pointerdown', e => {
  stop();
  g = { id: e.pointerId, x0: e.clientX, y0: e.clientY, ax: null, base: 0, s: [] };
});
stage.addEventListener('pointermove', e => {
  if (!g || e.pointerId !== g.id) return;
  const dx = e.clientX - g.x0, dy = e.clientY - g.y0;
  if (!g.ax){
    if (Math.abs(dx) < 7 && Math.abs(dy) < 7) return;
    g.ax = Math.abs(dx) > Math.abs(dy) ? AX.story : pageAxis();
    g.base = g.ax.get();
    try { stage.setPointerCapture(e.pointerId); g.held = true; } catch (_) {}
    g.x0 = e.clientX; g.y0 = e.clientY;          /* drop the slop */
    return;
  }
  /* sideways: dragging right sends this story away. upwards: dragging up peels
     the sheet off the pad. Both forward directions move paper away from you. */
  const raw = g.ax === AX.story
    ? g.base + (e.clientX - g.x0) / (W() * .55)
    : g.base - (e.clientY - g.y0) / (H() * .5);
  g.ax.set(bounded(g.ax, raw));
  g.s.push([e.timeStamp, g.ax.get()]);
  while (g.s.length > 2 && e.timeStamp - g.s[0][0] > 90) g.s.shift();
  render();
});
function release(e){
  if (!g || (e && e.pointerId !== g.id)) return;
  if (g.held) try { stage.releasePointerCapture(g.id); } catch (_) {}
  const ax = g.ax, s = g.s; g = null;
  if (ax && s.length) settle(ax, speed(s));
}
stage.addEventListener('pointerup', release);
stage.addEventListener('pointercancel', release);
stage.addEventListener('dragstart', e => e.preventDefault());
stage.addEventListener('touchmove', e => e.preventDefault(), { passive: false });

/* ---------- trackpad, on the same two axes ---------- */
let wT = 0, w = null;
stage.addEventListener('wheel', e => {
  if (e.ctrlKey) return;
  e.preventDefault();
  const k = e.deltaMode === 1 ? 16 : e.deltaMode === 2 ? H() : 1;
  const dx = e.deltaX * k, dy = e.deltaY * k;
  if (!w){
    stop();
    const ax = Math.abs(dx) > Math.abs(dy) ? AX.story : pageAxis();
    w = { ax, raw: ax.get() };
  }
  w.raw += w.ax === AX.story ? -dx * 2.2 / (W() * .55) : dy * 2.2 / (H() * .5);
  w.ax.set(bounded(w.ax, w.raw));
  render();
  clearTimeout(wT);
  wT = setTimeout(() => { const q = w; w = null; settle(q.ax, 0); }, 90);
}, { passive: false });

/* a plain mouse has one axis; keys cost nothing and say nothing on screen */
addEventListener('keydown', e => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const go = (ax, d) => { e.preventDefault(); stop(); springTo(ax, Math.round(ax.get()) + d, 0); };
  if (e.key === 'ArrowRight') go(AX.story, 1);
  else if (e.key === 'ArrowLeft') go(AX.story, -1);
  else if (e.key === 'ArrowUp' || e.key === ' ') go(pageAxis(), 1);
  else if (e.key === 'ArrowDown') go(pageAxis(), -1);
});

let resizeT = 0;
addEventListener('resize', () => {
  clearTimeout(resizeT);
  resizeT = setTimeout(() => { fitSheets(); render(); }, 120);
});

document.fonts.ready.then(() => { fitSheets(); render(); });
fitSheets(); render();
})();
</script>
</body>
</html>
