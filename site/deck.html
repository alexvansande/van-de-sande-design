<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="dark">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Deck — experiment</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=Caveat:wght@600&display=swap" rel="stylesheet">
<style>
:root{
  --night:#15120c;          /* the dark the deck sits in */
  --card:#f2cd49;           /* the page itself */
  --cink:#1d1810;           /* ink on that page */
  --violet:#6d5ae0;         /* what is underneath */
  --edge:255,246,214;       /* the faint page edges, as rgb parts */
  color-scheme:dark;
  box-sizing:border-box;
}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
body{margin:0;background:var(--night);color:var(--cink);
  font-family:"EB Garamond",Garamond,Georgia,serif;-webkit-font-smoothing:antialiased}

/* ---------- the stage ----------
   --cw/--ch are the page. Everything else is placed off them, so the peeking
   leaf, the edges further out and the bar below all stay in step at any size. */
.stage{position:fixed;inset:0;overflow:hidden;
  --cw:min(82vw, 36rem);
  --ch:min(78vh, 46rem);
  --gap:22px;              /* how far each leaf sits behind the last; JS owns it */
  touch-action:none;user-select:none;-webkit-user-select:none;
  -webkit-tap-highlight-color:transparent}

/* ---------- what is further to the right ----------
   The edges of leaves we have not reached. They read as a stack now and become
   the dividers between items once this is a list. */
.more{position:absolute;top:50%;translate:0 -50%;
  left:calc(50% + var(--cw)/2 + var(--gap)*4.6);
  right:0;height:calc(var(--ch) * .86);
  display:flex;gap:var(--gap);pointer-events:none}
.more b{display:block;width:1px;height:100%;flex:none;
  background:linear-gradient(180deg,
    rgba(var(--edge),0) 0%, rgba(var(--edge),.55) 18%,
    rgba(var(--edge),.55) 82%, rgba(var(--edge),0) 100%)}

/* ---------- what is underneath ----------
   The top edge of the next thing down, showing above the bottom of the screen. */
.below{position:absolute;left:50%;translate:-50% 0;
  bottom:calc(-1 * clamp(26px,4.4vh,40px));
  width:calc(var(--cw) * .92);height:clamp(58px,9vh,84px);
  background:var(--violet);border-radius:10px;
  box-shadow:0 -14px 34px -10px rgba(109,90,224,.55);
  pointer-events:none}
.below::before{content:"";position:absolute;inset:0 0 auto 0;height:1px;
  background:rgba(255,255,255,.28);border-radius:10px 10px 0 0}

/* ---------- the deck ---------- */
.deck{position:absolute;inset:0}
.card{position:absolute;top:50%;left:50%;
  width:var(--cw);height:var(--ch);
  margin-top:calc(var(--ch) / -2);margin-left:calc(var(--cw) / -2);
  background:var(--card);color:var(--cink);border-radius:3px;
  padding:clamp(1.6rem,4.2vh,2.6rem) clamp(1.4rem,4vw,2.2rem);
  display:flex;flex-direction:column;
  box-shadow:0 26px 60px -28px rgba(0,0,0,.85), 0 3px 10px -4px rgba(0,0,0,.5);
  transform-origin:50% 50%;will-change:transform,opacity;
  backface-visibility:hidden;-webkit-backface-visibility:hidden}
.card.gone{visibility:hidden}

/* ---------- the page that has text on it ---------- */
.run{display:flex;justify-content:space-between;gap:1rem;flex:none;
  font-size:.62rem;font-weight:500;letter-spacing:.26em;
  color:rgba(29,24,16,.5);margin:0 0 clamp(1.2rem,3.4vh,2rem)}
.body{flex:1;min-height:0}
.body p{margin:0;font-size:clamp(1.02rem,.92rem + .5vw,1.3rem);line-height:1.46;
  text-indent:1.4em;text-align:justify;hyphens:auto}
.body p:first-child{text-indent:0}
.folio{flex:none;font-size:.85rem;font-weight:500;color:rgba(29,24,16,.55)}

/* my name, marked on a page that is already yellow: the marker has to go
   darker than the paper instead of brighter */
.hl{background-color:transparent;color:inherit;
  background-image:linear-gradient(100deg,
    rgba(150,104,10,0) .5%, rgba(150,104,10,.34) 2%,
    rgba(150,104,10,.34) 97%, rgba(150,104,10,0) 99.5%);
  background-repeat:no-repeat;
  padding:.04em .16em;margin:0 -.1em;
  box-decoration-break:clone;-webkit-box-decoration-break:clone}

/* ---------- a page that is only a title ---------- */
.card.title{justify-content:center}
.card.title h2{margin:0;font-weight:400;line-height:1.02;letter-spacing:-.015em;
  font-size:clamp(2.1rem,1.7rem + 2.4vw,3.2rem)}
.card.title p{margin:.9rem 0 0;font-family:"Caveat",cursive;font-weight:600;
  line-height:1.15;color:rgba(29,24,16,.72);
  font-size:clamp(1.2rem,1rem + .8vw,1.6rem)}

/* a phone has no room for the running head at full tracking */
@media (max-width:30rem){
  .run{font-size:.55rem;letter-spacing:.14em}
}
@media (prefers-reduced-motion:reduce){
  .card{transition:none}
}
</style>
</head>
<body>
<main class="stage" id="stage" tabindex="-1" aria-label="Deck">
  <div class="more" id="more" aria-hidden="true"></div>
  <div class="deck" id="deck"></div>
  <div class="below" aria-hidden="true"></div>
</main>

<script>
(() => {
'use strict';

/* ===================================================================
   An experiment, not the site.

   The same book, dealt as a deck instead of bound as one. A leaf is not
   hinged here: you throw it away to the right, and the one behind it — whose
   edge you can already see — takes the middle.

   Nothing on screen explains itself in words. What you can do is what you
   can see: a leaf half out from behind this one, more edges past it, and the
   top of something purple below the bottom of the screen.
   =================================================================== */

const CARDS = [
  { run: ['THE INFINITE MACHINE', 'CAMILA RUSSO'], folio: '190',
    body: `<p>&ldquo;Honey, remember that giant pile of money I was talking about last week? The one kept safe by unhackable code?&rdquo; <mark class="hl">Alex</mark>, still glued to his smartphone screen, said to his wife.</p>
           <p>&ldquo;Yes?&rdquo;</p>
           <p>&ldquo;Well, it was hacked.&rdquo;</p>` },
  { title: 'Bend', sub: 'what happens when you stop assuming the surface is flat' },
  { title: 'The triangle of everything', sub: 'three corners, and everything sits somewhere between them' },
  { title: 'Hexagonal earth', sub: 'the whole planet, cut into sevens' },
  { title: 'Blog', sub: 'shorter things, in no particular order' }
];

const $ = s => document.querySelector(s);
const clamp = (x, a, b) => x < a ? a : x > b ? b : x;
const clamp01 = x => clamp(x, 0, 1);
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const stage = $('#stage'), deck = $('#deck');

/* four edges out to the right; the last ones barely there */
$('#more').innerHTML = [.9, .62, .4, .24].map(o =>
  `<b style="opacity:${o}"></b>`).join('');

const els = CARDS.map(c => {
  const el = document.createElement('article');
  el.className = 'card' + (c.title ? ' title' : '');
  el.innerHTML = c.title
    ? `<h2>${c.title}</h2><p>${c.sub}</p>`
    : `<header class="run"><span>${c.run[0]}</span><span>${c.run[1]}</span></header>
       <div class="body">${c.body}</div>
       <footer class="folio">${c.folio}</footer>`;
  deck.append(el);
  return el;
});

/* ===================================================================
   One number holds the whole deck: pos, the continuous index of the leaf in
   the middle. 0 is the first one squarely centred, 0.5 is the first one
   halfway thrown. A drag writes it, a spring catches it. Every leaf reads its
   own position off it, so there is no state to keep in sync.
   =================================================================== */
const LAST = CARDS.length - 1;
let pos = 0;

const W = () => stage.clientWidth;
const TOSS = () => W() * 1.15;             // far enough to clear the screen
/* The step between leaves is worked out here, not in CSS, and written back as
   a plain px value. A custom property holding a clamp() comes back out of
   getComputedStyle as the unresolved token, so anything parsing it gets NaN
   and every transform built from it is silently thrown away. */
function GAP(){
  const g = Math.round(clamp(W() * .034, 15, 36));
  stage.style.setProperty('--gap', g + 'px');
  return g;
}

function render(){
  const gap = GAP();
  els.forEach((el, i) => {
    const d = i - pos;
    if (d <= 0){
      /* leaving, or gone: t is how far through the throw it is */
      const t = clamp01(-d);
      if (-d > 1.02){ el.classList.add('gone'); return; }
      el.classList.remove('gone');
      const ease = t * t;                                  // it accelerates away
      el.style.transform =
        `translate3d(${(ease * TOSS()).toFixed(1)}px, ${(ease * W() * .09).toFixed(1)}px, 0)` +
        ` rotate(${(t * 15).toFixed(2)}deg)`;
      el.style.opacity = (1 - clamp01((t - .55) / .45) * .85).toFixed(3);
      el.style.zIndex = 100;
      el.style.filter = '';
      el.style.boxShadow = `0 ${(26 + t * 34).toFixed(0)}px ${(60 + t * 46).toFixed(0)}px -28px rgba(0,0,0,.85)`;
    } else {
      /* waiting behind: stepped to the right, a little smaller, a little darker */
      const s = Math.min(d, 4);
      el.classList.toggle('gone', d > 3.6);
      el.style.transform =
        `translate3d(${(s * gap).toFixed(1)}px, 0, 0) scale(${(1 - s * .035).toFixed(4)})`;
      el.style.opacity = (1 - clamp01((s - 1) / 3) * .55).toFixed(3);
      el.style.zIndex = 100 - Math.round(s * 10);
      el.style.filter = `brightness(${(1 - Math.min(s, 3) * .085).toFixed(3)})`;
      el.style.boxShadow = '';
    }
  });
}

/* ---------- the spring that catches what you let go of ---------- */
const STIFF = 210, DAMP = 29.5;
let vel = 0, target = 0, raf = 0, last = 0;
function springTo(t, v0){
  target = clamp(t, 0, LAST); vel = v0 || 0;
  if (!raf){ last = performance.now(); raf = requestAnimationFrame(tick); }
}
function tick(now){
  const dt = clamp((now - last) / 1000, .001, .032); last = now;
  vel += (-STIFF * (pos - target) - DAMP * vel) * dt;
  pos += vel * dt;
  if (Math.abs(pos - target) < .0006 && Math.abs(vel) < .02){
    pos = target; vel = 0; raf = 0; render(); return;
  }
  render();
  raf = requestAnimationFrame(tick);
}
function stop(){ if (raf){ cancelAnimationFrame(raf); raf = 0; } vel = 0; }

/* past a third of the way, or flicked hard enough to carry there */
const COMMIT = .33, CARRY = .2;
function settle(v){
  const from = Math.round(pos), proj = pos + v * CARRY;
  let t = proj > from + COMMIT ? from + 1 : proj < from - COMMIT ? from - 1 : from;
  springTo(clamp(t, 0, LAST), v);
}

/* the further past either end you pull, the less it gives */
const RUB = (over, give) => (1 - 1 / (over / give * .55 + 1)) * give;
function bounded(x){
  if (x < 0) return -RUB(-x, .16);
  if (x > LAST) return LAST + RUB(x - LAST, .16);
  return x;
}

/* ---------- the throw ---------- */
function speed(s){
  if (s.length < 2) return 0;
  const a = s[0], b = s[s.length - 1], dt = (b[0] - a[0]) / 1000;
  return dt > .008 ? clamp((b[1] - a[1]) / dt, -12, 12) : 0;
}
let g = null;
stage.addEventListener('pointerdown', e => {
  stop();
  g = { id: e.pointerId, x0: e.clientX, y0: e.clientY, base: pos, axis: null, s: [] };
});
stage.addEventListener('pointermove', e => {
  if (!g || e.pointerId !== g.id) return;
  const dx = e.clientX - g.x0, dy = e.clientY - g.y0;
  if (!g.axis){
    if (Math.abs(dx) < 7 && Math.abs(dy) < 7) return;
    // vertical belongs to whatever is under the purple bar, which is not built
    // yet, so for now only the horizontal throw is live
    g.axis = Math.abs(dx) > Math.abs(dy) ? 'x' : 'y';
    if (g.axis === 'y'){ g = null; return; }
    try { stage.setPointerCapture(e.pointerId); g.held = true; } catch (_) {}
    g.x0 = e.clientX;
    return;
  }
  // dragging right throws the leaf away, so right is forward
  pos = bounded(g.base + (e.clientX - g.x0) / (W() * .55));
  g.s.push([e.timeStamp, pos]);
  while (g.s.length > 2 && e.timeStamp - g.s[0][0] > 90) g.s.shift();
  render();
});
function release(e){
  if (!g || (e && e.pointerId !== g.id)) return;
  if (g.held) try { stage.releasePointerCapture(g.id); } catch (_) {}
  const s = g.s; g = null;
  if (s.length) settle(speed(s));
}
stage.addEventListener('pointerup', release);
stage.addEventListener('pointercancel', release);
stage.addEventListener('dragstart', e => e.preventDefault());
stage.addEventListener('touchmove', e => e.preventDefault(), { passive: false });

/* trackpad, on the same axis as the hand */
let wT = 0, wRaw = null;
stage.addEventListener('wheel', e => {
  if (e.ctrlKey) return;
  if (Math.abs(e.deltaX) < Math.abs(e.deltaY)) return;    // vertical is not ours yet
  e.preventDefault();
  if (wRaw === null){ stop(); wRaw = pos; }
  const k = e.deltaMode === 1 ? 16 : e.deltaMode === 2 ? W() : 1;
  wRaw += -e.deltaX * k * 2.2 / (W() * .55);
  pos = bounded(wRaw);
  render();
  clearTimeout(wT);
  wT = setTimeout(() => { wRaw = null; settle(0); }, 90);
}, { passive: false });

/* a plain mouse has no second axis; keys are invisible, so they cost nothing */
addEventListener('keydown', e => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.key === 'ArrowRight' || e.key === ' '){ e.preventDefault(); stop(); springTo(Math.round(pos) + 1); }
  else if (e.key === 'ArrowLeft'){ e.preventDefault(); stop(); springTo(Math.round(pos) - 1); }
});

let resizeT = 0;
addEventListener('resize', () => { clearTimeout(resizeT); resizeT = setTimeout(render, 120); });

document.fonts.ready.then(render);
render();
})();
</script>
</body>
</html>
