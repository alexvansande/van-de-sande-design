<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="light">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Alex Van de Sande</title>
<script>document.documentElement.classList.add('js')</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=Caveat:wght@500;600;700&family=Crimson+Pro:ital,wght@0,400;1,400&family=Cardo:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#f7f1de; --ink:#262420; --ghost:#8c8674; --pen:#2b4d86;
  --shelf:#17140f; --shelf-ink:#e9e1ca;
  --menu:min(78vw,23rem);
  color-scheme:light;
  box-sizing:border-box;
}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
body{margin:0;background:var(--shelf);color:var(--ink);
  font-family:"EB Garamond",Garamond,Georgia,serif;-webkit-font-smoothing:antialiased}

/* ---------- the index, lying under everything ---------- */
/* --m is how far the site has been pulled off it, 0 closed, 1 open. Every
   property below reads from it, so the whole panel is a function of the drag. */
.shelf{position:fixed;inset:0;z-index:0;background:var(--shelf);color:var(--shelf-ink);
  --m:0;display:flex;align-items:center;overflow:hidden}
.shelf::after{content:"";position:absolute;inset:0;background:#000;
  opacity:calc(.55 - var(--m) * .55);pointer-events:none}
.shelf .sheet{width:var(--menu);padding:0 1.6rem 0 clamp(1.4rem,5vw,2.4rem);
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.shelf h2{margin:0 0 1.5rem;font-size:.7rem;font-weight:500;letter-spacing:.3em;
  color:#8f866d}
.shelf ol{list-style:none;margin:0;padding:0}
.shelf li{margin:0 0 .15rem}
.shelf button{display:block;width:100%;text-align:left;background:none;border:0;padding:.42rem 0;
  color:inherit;font:inherit;font-size:clamp(1.3rem,1.15rem + .6vw,1.65rem);line-height:1.15;
  cursor:pointer;
  /* each line arrives a little after the one above it as the page is pulled */
  opacity:calc(var(--m) * var(--m) * 1.35 - var(--i) * .06);
  transform:translateX(calc((var(--m) - 1) * 1.6rem));
  transition:color .2s ease}
.shelf button .sub{display:block;font-family:"Caveat",cursive;font-size:.95rem;font-weight:600;
  color:#7d7460;margin-top:.05rem}
.shelf li.here button{color:#fff}
.shelf button:hover,.shelf button:focus-visible{color:#fff;outline:none}
.shelf button:focus-visible .sub{color:var(--pen)}
.shelf li.here{position:relative}
.shelf li.here::before{content:"";position:absolute;left:-.95rem;top:1.15rem;width:.4rem;height:.4rem;
  border-radius:50%;background:var(--pen);box-shadow:0 0 0 3px rgba(43,77,134,.25)}
.shelf .foot{margin-top:2rem;font-family:"Caveat",cursive;font-size:1.1rem;color:#6d6555;
  opacity:calc(var(--m) * var(--m))}
.shelf .foot a{color:#9aa8c4;text-decoration:underline;text-underline-offset:3px}

/* ---------- the site itself, a sheet over the index ---------- */
.shell{position:fixed;inset:0;z-index:1;overflow:hidden;background:var(--paper);
  touch-action:none;will-change:transform;
  user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;
  box-shadow:-1px 0 0 rgba(0,0,0,.25), -30px 0 60px -10px rgba(0,0,0,.6)}
.stack{position:absolute;inset:0;will-change:transform}
.story{position:absolute;left:0;right:0;height:100%}
.leaves{position:relative;width:min(100% - 2.5rem, 60rem);height:100%;margin:0 auto;perspective:2600px}

/* ---------- a leaf ---------- */
.leaf{position:absolute;top:0;left:-1.25rem;width:calc(100% + 2.5rem);height:100%;background:var(--paper);
  display:flex;flex-direction:column;
  padding:calc(clamp(2.5rem,7vh,4.5rem) + env(safe-area-inset-top,0px)) 1.25rem
          calc(clamp(1.5rem,4vh,2.5rem) + env(safe-area-inset-bottom,0px));
  transform-origin:left center;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.leaf.turned{transform:rotateY(-178deg)}
.leaf.lifted{visibility:hidden}

/* the bending sheet: strips chained hinge to hinge */
.curl{position:absolute;top:0;height:100%;z-index:60;transform-style:preserve-3d;pointer-events:none}
.strip{position:absolute;top:0;height:100%;transform-origin:left center;transform-style:preserve-3d}
.strip .face,.strip .back{position:absolute;inset:0;overflow:hidden;
  backface-visibility:hidden;-webkit-backface-visibility:hidden}
.strip .face{background:var(--paper)}
.strip .back{background:var(--paper);transform:rotateY(180deg)}
.strip .face > .leaf{visibility:visible}
.strip .sh{position:absolute;inset:0;opacity:0;will-change:opacity}
.strip .sh.l{background:linear-gradient(90deg,rgb(58,44,18),rgba(58,44,18,0))}
.strip .sh.r{background:linear-gradient(90deg,rgba(58,44,18,0),rgb(58,44,18))}
.strip .back::after{content:"";position:absolute;inset:0;background:rgba(58,44,18,.08)}
.strip .ghost{position:absolute;inset:0;overflow:hidden;transform:scaleX(-1);opacity:.1}
.strip .ghost .rest span[style*="--b"]{visibility:hidden}
.cast{position:absolute;top:0;height:100%;z-index:59;pointer-events:none;opacity:0;
  transform-origin:left center;will-change:transform,opacity;
  background:linear-gradient(90deg,rgb(58,44,18) 0%,rgba(58,44,18,.55) 52%,rgba(58,44,18,.25) 86%,rgba(58,44,18,0) 100%)}

/* ---------- book typography ---------- */
.text{flex:1;min-height:0;display:flex;flex-direction:column;max-width:34rem}
.running{display:flex;justify-content:space-between;gap:1rem;font-weight:500;font-size:.72rem;
  letter-spacing:.28em;margin:0 0 2.2rem;flex:none}
.running span:last-child{letter-spacing:.2em;font-weight:400;color:var(--ghost)}
.recto .running{justify-content:flex-end}
.body p,.rest p{margin:0;font-size:clamp(1.22rem,1.05rem + .75vw,1.45rem);line-height:1.45;
  text-indent:1.5em;text-align:justify;hyphens:auto}
.rest{flex:1;min-height:0;overflow:hidden;user-select:none}
.rest span[style*="--b"]{color:transparent;text-shadow:0 0 calc(var(--b) * 2) rgba(38,36,32,var(--o))}
.folio{flex:none;margin-top:1.4rem;font-weight:500;font-size:.95rem}
.recto .folio{text-align:right}
.leaf.cryp{font-family:"Crimson Pro",Georgia,serif}
.cryp .running{display:grid;grid-template-columns:1fr auto 1fr;letter-spacing:0;font-weight:400;
  font-size:1.02rem;margin-bottom:1.6rem}
.cryp .running span:nth-child(2){color:var(--ink);letter-spacing:.01em}
.running .au{margin-left:.9em;color:var(--ghost)}
.ether .running .au{font-variant:normal;letter-spacing:.02em;font-size:.88em}
.cryp .running span:last-child{text-align:right;color:var(--ink);letter-spacing:0}
.cryp .rest p{font-size:clamp(1.2rem,1.05rem + .7vw,1.4rem);line-height:1.42;text-indent:1.3em}
.hl{background:none;color:inherit}
.leaf.ether{font-family:"Cardo",Georgia,serif}
.ether .running{justify-content:flex-start;gap:0;letter-spacing:0;font-weight:400;margin-bottom:1.5rem}
.ether .running span:first-child{width:2.5rem;color:var(--ink);font-size:1rem}
.ether .running span:last-child{flex:1;text-align:center;color:var(--ink);font-variant:small-caps;
  letter-spacing:.14em;font-size:1.15rem;padding-right:2.5rem}
.ether .rest p{font-size:clamp(1.05rem,.95rem + .5vw,1.22rem);line-height:1.38;text-align:left;
  text-indent:-1.4em;padding-left:1.4em;margin:0 0 .35em;hyphens:none}
.ether .rest h4{font-weight:700;font-size:1rem;margin:1.1em 0 .55em}

/* ---------- my own pages: covers and plates ---------- */
.leaf.mine{justify-content:center}
.cover{max-width:34rem}
.cover .kicker{font-size:.7rem;font-weight:500;letter-spacing:.3em;color:var(--ghost);margin:0 0 1.2rem}
.cover h1{margin:0;font-weight:400;font-size:clamp(2.6rem,2rem + 4vw,4.6rem);line-height:.98;
  letter-spacing:-.015em}
.cover .sub{margin:1.1rem 0 0;font-family:"Caveat",cursive;font-weight:600;color:var(--pen);
  font-size:clamp(1.5rem,1.25rem + 1vw,2.1rem);line-height:1.15;transform:rotate(-1.4deg);
  transform-origin:left}
.plate{flex:1;min-height:0;display:flex;flex-direction:column;gap:1rem;max-width:40rem;width:100%}
.plate .frame{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;
  border:1px solid rgba(38,36,32,.22);background:rgba(38,36,32,.03);overflow:hidden}
.plate .frame img{width:100%;height:100%;object-fit:contain;-webkit-user-drag:none;user-drag:none}
.plate .frame .slot{font-size:.7rem;letter-spacing:.28em;text-transform:uppercase;color:var(--ghost);text-align:center;
  padding:1.5rem;line-height:2}
.plate figcaption{flex:none;font-style:italic;color:var(--ink);font-size:clamp(1rem,.95rem + .3vw,1.15rem);
  line-height:1.35;max-width:32rem}
.plate figcaption b{font-style:normal;font-weight:500;font-size:.68rem;letter-spacing:.26em;
  color:var(--ghost);display:block;margin-bottom:.4rem}
.prose{max-width:34rem}
.prose h3{margin:0 0 1.1rem;font-weight:400;font-size:clamp(1.7rem,1.4rem + 1.2vw,2.4rem);line-height:1.08}
.prose p{margin:0 0 .85rem;font-size:clamp(1.12rem,1.02rem + .5vw,1.3rem);line-height:1.5}
.prose .todo{color:var(--ghost);font-style:italic}
.prose .links{display:flex;flex-wrap:wrap;gap:1.4rem;margin-top:1.5rem;font-family:"Caveat",cursive;
  font-size:1.5rem;transform:rotate(-1.2deg)}
.prose .links a{color:var(--pen);text-decoration:underline;text-decoration-thickness:1.5px;
  text-underline-offset:4px}

/* ---------- my handwriting in the margin ---------- */
.hand{position:absolute;font-family:"Caveat",cursive;color:var(--pen);font-weight:600;
  font-size:clamp(1.35rem,1.15rem + .8vw,1.85rem);line-height:1.12;transform:rotate(-1.7deg);
  opacity:0;transition:opacity .55s ease;pointer-events:none;
  left:1.25rem;right:1.25rem;bottom:calc(clamp(1.5rem,4vh,2.5rem) + env(safe-area-inset-bottom,0px));
  text-shadow:0 0 4px var(--paper),0 0 8px var(--paper),0 0 14px var(--paper),
    0 0 24px var(--paper),0 0 34px var(--paper)}
.leaf.front .hand{opacity:1}
.leaf.front .hand.wait{opacity:0}
.leaf.front .hand.wait.said{opacity:1}
.hand .todo{color:var(--ghost);font-weight:500}
/* my first line sits up in the page, so the hints have the foot to themselves */
.hand.intro{top:54%;bottom:auto}
.note{position:absolute;white-space:nowrap;transform:rotate(-2.5deg);transform-origin:left top;
  font-family:"Caveat",cursive;font-weight:500;color:var(--pen);font-size:1.6rem;line-height:1.05;
  opacity:0;transition:opacity .35s ease}
.note.on{opacity:1}
svg.ink{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
svg.ink path{fill:none;stroke:var(--pen);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* the corner you grab to turn a page */
.ear{position:absolute;right:0;bottom:0;width:clamp(3rem,9vw,4.5rem);aspect-ratio:1;z-index:70;
  cursor:pointer;border:0;padding:0;background:none;opacity:0;transition:opacity .5s ease .2s;
  -webkit-tap-highlight-color:transparent}
body.ready .leaf.front .ear{opacity:1}
.ear svg{width:100%;height:100%;display:block}
.ear .fold{fill:rgba(38,36,32,.055);stroke:rgba(38,36,32,.3);stroke-width:1}
.ear:hover .fold,.ear:focus-visible .fold{fill:rgba(38,36,32,.12)}
.ear:focus-visible{outline:2px solid var(--pen);outline-offset:-2px}

/* ---------- the three hints, in my hand ---------- */
.hints{position:fixed;z-index:80;left:clamp(1.25rem,5vw,3rem);
  bottom:calc(clamp(4rem,9vh,5rem) + env(safe-area-inset-bottom,0px));
  font-family:"Caveat",cursive;font-weight:600;color:var(--pen);font-size:clamp(1.1rem,1rem + .4vw,1.35rem);
  line-height:1.5;pointer-events:none;opacity:0;transition:opacity .7s ease;
  text-shadow:0 0 4px var(--paper),0 0 9px var(--paper),0 0 16px var(--paper),
    0 0 26px var(--paper),0 0 36px var(--paper)}
.hints.on{opacity:1}
.hints div{display:flex;gap:.55rem;align-items:baseline}
.hints i{font-style:normal;width:1.1em;text-align:center;font-size:1.15em;line-height:1}

/* ---------- where you are ---------- */
.ticks{position:fixed;z-index:80;right:.7rem;top:50%;transform:translateY(-50%);
  display:flex;flex-direction:column;gap:.45rem;pointer-events:none;
  opacity:0;transition:opacity .5s ease}
.ticks.on{opacity:.85}
.ticks b{width:4px;height:4px;border-radius:50%;background:rgba(38,36,32,.24)}
.ticks b.on{background:var(--pen);transform:scale(1.5)}
.pips{position:fixed;z-index:80;left:50%;transform:translateX(-50%);
  bottom:calc(.75rem + env(safe-area-inset-bottom,0px));display:flex;gap:.4rem;
  pointer-events:none;opacity:0;transition:opacity .5s ease}
.pips.on{opacity:.8}
.pips b{width:1.1rem;height:2px;background:rgba(38,36,32,.18)}
.pips b.on{background:var(--pen)}

/* ---------- roomier screens ---------- */
@media (min-width:56rem){
  .leaf{left:-3rem;width:calc(100% + 6rem);padding-left:3rem;padding-right:3rem}
  .hand{left:auto;right:3rem;bottom:auto;top:34%;width:min(18rem,26vw);text-align:left;
    text-shadow:none}
  .hand.intro{top:34%}
  .plate{max-width:35rem}
  .cover,.prose{margin-left:0}
}
@media (prefers-reduced-motion:reduce){
  .hand,.note,.hints,.ear,.ticks,.pips{transition:none}
}
</style>
</head>

<script>
(() => {
'use strict';

/* ===================================================================
   Which way is forward.

   FWD_DX is the sign of the horizontal finger movement that advances a
   page. -1 means dragging LEFT turns the page: the leaf is hinged on its
   left edge and swings away over the spine, the way a real book works,
   so the story travels off to the right as you read.

   The index therefore lives off to the LEFT, and you reach it by
   dragging the opposite way, RIGHT, peeling the whole site off it.

   To reverse the reading direction, set FWD_DX to 1 — and move the
   index panel to the right-hand side in the CSS (.shelf .sheet
   alignment, and the sign of the .shell box-shadow offset).
   =================================================================== */
const FWD_DX = -1;

/* ===================================================================
   THE STORIES
   Each story is a stack of pages. Page kinds:
     p190 / cryptopians / ether  the three real book pages
     cover   title page for a story
     plate   a picture with a caption; put a file in site/img and set art
     prose   a page of text, optionally with links
   Any page may carry `hand`: a line in my handwriting in the margin,
   which fades in when that page is the one you are looking at.
   =================================================================== */
const STORIES = [
  {
    id: 'van-de-sande',
    title: 'Van de Sande',
    sub: 'my name, in other people’s books',
    pages: [
      { kind:'p190' },
      { kind:'cryptopians',
        hand:'In 2014 I was invited to work for a 19 year old who was going to pay me in made up money.' },
      { kind:'ether',
        hand:'They were building something nobody had heard of and few understood. The apps were ugly, the team sounded all sorts of crazy. I loved it.' }
    ]
  },
  {
    id: 'ethereum',
    title: 'The Ethereum story',
    sub: 'ten years of explaining a thing that did not exist yet',
    pages: [
      { kind:'cover' },
      { kind:'plate', slot:'Mist wallet, first run',
        caption:['2015', 'The first wallet. Someone had to decide what an account looks like when there is no bank behind it.'],
        hand:'<span class="todo">tell the Mist story here — the identicons, the seed phrase argument</span>' },
      { kind:'plate', slot:'The DAO, June 2016',
        caption:['2016', 'The night we pushed the button.'],
        hand:'<span class="todo">the Robin Hood Group, from the apartment in Rio</span>' },
      { kind:'prose', title:'ENS, and names that belong to you',
        paras:['<span class="todo">A page about names: why avsa.eth matters more than it looks, and what breaks when an address is forty hex characters.</span>'],
        links:[['avsa.eth','https://app.ens.domains/avsa.eth']] }
    ]
  },
  {
    id: 'bend',
    title: 'Bend',
    sub: 'what happens when you stop assuming the surface is flat',
    pages: [
      { kind:'cover' },
      { kind:'plate', slot:'Bend — opening image',
        caption:['One', 'Straight lines are a decision, not a fact.'],
        hand:'<span class="todo">Alex — is this the bending/curvature story, or did I mishear and it is the band story? Tell me and I will rewrite this stack.</span>' },
      { kind:'plate', slot:'Bend — second image',
        caption:['Two', '<span class="todo">caption</span>'] }
    ]
  },
  {
    id: 'triangle',
    title: 'The triangle of everything',
    sub: 'three corners, and everything sits somewhere between them',
    pages: [
      { kind:'cover' },
      { kind:'plate', slot:'The triangle',
        caption:['The diagram', 'Every interesting thing is a trade-off between three things, never two.'],
        hand:'<span class="todo">name the three corners, and the things that sit in the middle</span>' },
      { kind:'prose', title:'Why three',
        paras:['<span class="todo">Two things make a slider and people pick an end. Three make a space, and you have to admit where you actually are.</span>',
               '<span class="todo">second paragraph</span>'] }
    ]
  },
  {
    id: 'hexagonal-earth',
    title: 'Hexagonal earth',
    sub: 'the whole planet, cut into sevens',
    pages: [
      { kind:'cover' },
      { kind:'plate', slot:'Gosper hierarchy — a hex divided into seven',
        caption:['The construction', 'A hexagon splits into seven hexagons, each turned about 19° and smaller by √7. Do it twice and you have forty-nine.'],
        hand:'the map is real and you can drive it — it is a whole app' },
      { kind:'prose', title:'An equal-area world on a hexagonal grid',
        paras:['<span class="todo">Why hexagons beat squares for a globe, what the projection gives up, and the migration routes drawn over ten thousand years.</span>'],
        links:[['open the map','https://alexvansande.github.io/hexagonal-world/'],
               ['the code','https://github.com/alexvansande/hexagonal-world']] }
    ]
  },
  {
    id: 'blog',
    title: 'Blog',
    sub: 'shorter things, in no particular order',
    pages: [
      { kind:'cover' },
      { kind:'prose', title:'Recent',
        paras:['<span class="todo">Point this at wherever the writing actually lives — a feed, a list of links, or pages in this same book.</span>'],
        links:[['github','https://github.com/alexvandesande']] }
    ]
  }
];

/* The two later book pages, verbatim from the scroll version of the site.
   "context" is the text around a highlighted passage: it renders softly out
   of focus but readable. Left empty, the slot shows unreadable filler. */
const CRYPTOPIANS = {
  title: "The Cryptopians", author: "Laura Shin", folio: 79,
  paras: [
    { context: `Jeff's team in particular found their boss flexible and easygoing.
He told them they could work on whatever they wanted, however much they wanted, but if they abused his trust, they would be fired. Jeff was also funny. He played the grumpy guy but was actually a teddy bear. He often teased and screwed around with people, but it was obvious he was joking. He was a boss who didn't want to be a boss. Plus, he was always accessible. He was logged onto Gitter, on a public Go Ethereum channel, all day long, which was nice for his remote team members, such as the black-, curly-haired Péter Szilágyi in Transylvania and `, filler: 38,
      quote: "Alex van de Sande, aka Avsa, a designer in Rio de Janeiro whose high forehead and disheveled locks gave him a professorial vibe. Everyone felt part of the team." },
    { context: `Those under Gavin had a different experience. If a few developers came up with an idea, he would sometimes immediately shoot it down. Often he was right, but still, it was frustrating to work with someone who was constantly telling you that you were wrong and, even if maybe you weren't, forcing you to do things his way. He would even berate Vitalik, telling him on Skype, "You said you were going to do x, or
"This is what's more important," or "This idea is going to be better." Everyone found him at the very least "intense" and, as one person put it, "always expecting everyone to be as productive as him." `, filler: 34,
      quote: "Once, when Avsa was in Amsterdam from Rio, working with Jeff, the second Gav heard he was there, he immediately asked Alex to take a train to Zug to work with him. The same thing happened on Avsa’s second Amsterdam trip—that time he was called to London." },
    { context: `As time went on, however, his employees found Gavin became more of an "ideas guy" who made his underlings execute his vision, while claiming credit and never praising them. Still, they found him "brilliant" or thought him "a smart guy, but not the best boss." One worker felt Gav was "justified" to be "very full of himself... because... he's very good at what he does." One supporter compared Gav to Steve Jobs. "Can he rub people the wrong way? Yes... but does that make him a bad person? No." Because he was aloof, Gav's C++ team conversed in a private Skype group, which at least one person felt made the C++ client less approachable than Jeff's Go client, whose Gitter was open to the public.`, filler: 90 }
  ]
};
const NEXT = "By that time, most token holders had heard the news. Rather than create their own child DAOs and wait seven days to withdraw their money from the main DAO, like *Titanic* passengers in nightgowns diving into the first lifeboats they could find, they were jumping into whatever child DAO had an approaching deadline.";

const $ = s => document.querySelector(s);
const el = (t, c) => { const e = document.createElement(t); if (c) e.className = c; return e; };
const clamp = (x, a, b) => x < a ? a : x > b ? b : x;
const clamp01 = x => clamp(x, 0, 1);
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const coarse = matchMedia('(pointer: coarse)').matches;
const wide = () => matchMedia('(min-width:56rem)').matches;
const shell = $('#shell'), stack = $('#stack'), shelf = $('#shelf');

/* ---------- blurred text: unreadable filler, and real text out of focus ---------- */
const LTR = "etaoinshrdlcumwfgypbvk";
const word = () => { let n = 2 + Math.floor(Math.random()*8), w = "";
  for (let i=0;i<n;i++) w += LTR[Math.floor(Math.random()*LTR.length)]; return w; };
const fillerWords = c => [...Array(c)].map((_, i) => { let w = word();
  if (!i || Math.random() < .07) w = w[0].toUpperCase() + w.slice(1);
  if (Math.random() < .08) w += ","; return w; });
function addWords(host, words, blurAt){
  words.forEach((w, i) => {
    const s = el('span'), it = w.startsWith('*'); w = w.replace(/\*/g, '');
    s.textContent = w; if (it) s.style.fontStyle = 'italic';
    const [b, o] = blurAt(i);
    s.style.setProperty('--b', b.toFixed(2) + 'px');
    s.style.setProperty('--o', o.toFixed(2));
    host.append(s, ' ');
  });
}

    const wrap = el('span');
    if (!real) wrap.setAttribute('aria-hidden', 'true');
    // depth of field: softest right next to a highlight, fading with distance
    addWords(wrap, words, i => { const d = pa.quote ? n - i : i + 1, t = Math.min(1, d/70);

/* ---------- the index ---------- */

/* ---------- where you are ---------- */
const ticks = $('#ticks'), pips = $('#pips');
STORIES.forEach(() => ticks.append(el('b')));
const tickEls = [...ticks.children];
let pipEls = [];
function buildPips(n){
  pips.replaceChildren(...[...Array(n)].map(() => el('b')));
  pipEls = [...pips.children];
}

/* ===================================================================
   THE BENDING SHEET
   A leaf is sliced into vertical strips chained edge to edge, each hinged
   on the one before it. Strips nearer the free edge lead, so the sheet
   bends like paper; shading blends across strip edges. setTurn takes any
   fraction, so the paper sits wherever the finger left it.
   =================================================================== */
const STRIPS = 10, CURL = .55;
function buildCurl(lf){
  const W = lf.offsetWidth, H = lf.offsetHeight, sw = W / STRIPS;
  // the turning page is the one being looked at, so it shows its margin note
  const host = el('div', 'curl');
  host.style.left = lf.offsetLeft + 'px'; host.style.width = W + 'px';
  let parent = host; const parts = [];
  for (let k = 0; k < STRIPS; k++){
    const st = el('div', 'strip');
    st.style.width = (sw + .6) + 'px'; st.style.left = k ? sw + 'px' : '0px';
    const face = el('div', 'face');
    const copy = lf.cloneNode(true);
    copy.removeAttribute('id'); copy.classList.remove('turned', 'lifted'); copy.classList.add('front');
    copy.querySelectorAll('[id]').forEach(e => e.removeAttribute('id'));
    copy.style.cssText = `position:absolute;top:0;left:${-k*sw}px;width:${W}px;height:${H}px;transform:none;z-index:auto`;
    // each side carries two fixed gradients, dark-left and dark-right; weighting
    // their opacities blends the shade smoothly from one strip edge to the next
    const a1 = el('div', 'sh l'), b1 = el('div', 'sh r'); face.append(copy, a1, b1);
    const back = el('div', 'back');
    // the back of the sheet: the same page's ink showing through, mirrored, very faint
    const ghost = el('div', 'ghost'); ghost.append(copy.cloneNode(true));
    const a2 = el('div', 'sh l'), b2 = el('div', 'sh r'); back.append(ghost, a2, b2);
    st.append(face, back); parent.append(st); parent = st;
    parts.push({ st, a1, b1, a2, b2 });
  }
  const cast = el('div', 'cast');              // shadow the sheet throws on the page below
  cast.style.left = host.style.left; cast.style.width = host.style.width;
  lf.parentNode.append(cast, host);
  lf._curl = { host, cast, parts, W, sw, live: false };
  park(lf);
}
/* Cloning a page into strips is the one expensive step of a turn: every word
   is copied twenty times and painted. So it happens while you read, not when
   your finger lands. A parked curl lies flat beneath all the leaves, hidden
   by the page on top, already painted; turning just lifts it into place. */
function park(lf){
  const c = lf._curl;
  c.live = false; c.host.style.zIndex = c.cast.style.zIndex = '0';
  lf.classList.remove('lifted');
  drawCurl(lf, 0);
}
function liven(lf){
  const c = lf._curl;
  if (c.live) return;
  c.live = true; c.host.style.zIndex = c.cast.style.zIndex = '';
  lf.classList.add('lifted');
}
function dropCurl(lf){
  if (!lf._curl) return;
  lf._curl.host.remove(); lf._curl.cast.remove(); lf._curl = null;
  lf.classList.remove('lifted');
}
/* Whichever edge you are pulling leads. Turning forward, the free edge lifts
   first and the paper near the spine follows; pulling a page back, the free
   edge comes back first and the spine side is the last to unfold. */
const profile = (e, back) => [...Array(STRIPS)].map((_, k) => { const f = k / (STRIPS - 1);
  return -180 * clamp01(e * (1 + CURL) - CURL * (back ? f : 1 - f)); });
function drawCurl(lf, e){
  const { parts, cast, W, sw } = lf._curl, back = lf._dir < 0;
  const ang = profile(e, back);
  const dk = ang.map(a => Math.abs(Math.sin(a * Math.PI / 180)));
  const edge = i => (dk[Math.max(0, i - 1)] + dk[Math.min(STRIPS - 1, i)]) / 2;
  let prev = 0;
  parts.forEach((pt, k) => {
    pt.st.style.transform = `rotateY(${(ang[k] - prev).toFixed(2)}deg)`; prev = ang[k];
    const L = edge(k), R = edge(k + 1);
    pt.a1.style.opacity = (L * .22).toFixed(3); pt.b1.style.opacity = (R * .22).toFixed(3);
    pt.a2.style.opacity = (R * .18).toFixed(3); pt.b2.style.opacity = (L * .18).toFixed(3);
  });
  // where the free edge sits over the page right now (0 = spine, 1 = open)
  const reach = Math.max(0, ang.reduce((x, a) => x + sw * Math.cos(a * Math.PI / 180), 0)) / W;
  cast.style.opacity = (Math.sin(Math.PI * e) * .28).toFixed(3);   // strongest mid-turn
  cast.style.transform = `scaleX(${Math.min(1, reach + .16).toFixed(4)})`;
}
/* The paper's free edge stays under your finger. The page axis p is how far
   the edge has travelled across the page, 0 to 1, so the edge belongs at
   (1 - p) of the width from the spine. The bend that puts it there is found
   by inverting the profile: tabulate where the edge lands for each bend,
   then read the table backwards. Near the spine there is nothing left to
   drag against, so the last fifth of the travel lets the sheet fall over. */
const EDGE = [false, true].map(back => [...Array(241)].map((_, i) =>
  profile(i / 240, back).reduce((x, a) => x + Math.cos(a * Math.PI / 180), 0) / STRIPS));
function bend(p, back){
  const t = EDGE[+back], want = 1 - p;
  let i = 0; while (i < 240 && t[i + 1] > want) i++;
  const e = i >= 240 ? 1 : (i + clamp01((t[i] - want) / (t[i] - t[i + 1] || 1))) / 240;
  const fall = clamp01((p - .8) / .2), s = fall * fall * (3 - 2 * fall);
  return e + (1 - e) * s;
}
function setTurn(lf, p, keep){
  p = clamp01(p);
  if (reduce) p = p > .5 ? 1 : 0;
  if (lf._p === p && lf._keep === keep) return;
  lf._p = p; lf._keep = keep;
  if (!keep && (p <= 0 || p >= 1)){
    if (lf._curl) park(lf);
    lf.classList.toggle('turned', p >= 1); return;
  }
  lf.classList.remove('turned');
  if (!lf._curl) buildCurl(lf);
  liven(lf);
  drawCurl(lf, bend(p, lf._dir < 0));
}

/* ===================================================================
   THREE AXES
   page   which page of the story you are on, in pages
   story  which story you are on, in stories
   menu   how far the site has been pulled off the index, 0 to 1
   Each is a continuous number. Nothing is a triggered animation: a drag
   writes the number, a release hands it to a spring.
   =================================================================== */
const N = STORIES.length;
const P = STORIES.map(() => 0);
const V = { py: 0, mx: 0 };
let si = 0, dirty = 0, warmLeaf = null;

const W = () => shell.clientWidth, H = () => shell.clientHeight;
const MENU = () => Math.min(shell.clientWidth * .78, 368);

/* A page axis belongs to one story. It is bound at the moment the gesture
   starts, because si moves while a story spring is in the air and a page
   spring must keep writing to the story it was launched from. */
const pageAxis = i => ({ key: 'page', story: i,
  get: () => P[i], set: x => { P[i] = x; dirty = i; },
  lo: () => 0, hi: () => STORIES[i].pages.length - 1, give: .12 });
const STORY_AXIS = { key: 'story', get: () => V.py, set: x => { V.py = x; },
  lo: () => 0, hi: () => N - 1, give: .35 };
const MENU_AXIS = { key: 'menu', get: () => V.mx, set: x => { V.mx = x; },
  lo: () => 0, hi: () => 1, give: .18 };
const axis = k => k === 'page' ? pageAxis(si) : k === 'story' ? STORY_AXIS : MENU_AXIS;

/* the further past the end you pull, the less it gives */
const RUB = (over, give) => (1 - 1/(over/give*.55 + 1)) * give;
function bounded(ax, x){
  const lo = ax.lo(), hi = ax.hi();
  if (x < lo) return lo - RUB(lo - x, ax.give);
  if (x > hi) return hi + RUB(x - hi, ax.give);
  return x;
}

function paint(i){
  const s = STORIES[i], p = P[i];
  s._leaves.forEach((lf, j) => setTurn(lf, p - j, lf === warmLeaf));
  const f = clamp(Math.round(p), 0, s._leaves.length - 1);
  s._leaves.forEach((lf, j) => lf.classList.toggle('front', j === f));
  if (i === si) markPips(f);
}
function commit(){
  stack.style.transform = `translate3d(0,${(-V.py*100).toFixed(4)}%,0)`;
  shell.style.transform = `translate3d(${(V.mx*MENU()).toFixed(2)}px,0,0)`;
  shelf.style.setProperty('--m', V.mx.toFixed(4));
  shelf.setAttribute('aria-hidden', V.mx > .5 ? 'false' : 'true');
  if (dirty !== null){ paint(dirty); dirty = null; }
  const s0 = clamp(Math.round(V.py), 0, N - 1);
  if (s0 !== si){ si = s0; onStory(); }
}
let pend = 0;
function soon(){ if (!pend) pend = requestAnimationFrame(() => { pend = 0; commit(); }); }
function commitAll(){ STORIES.forEach((_, i) => paint(i)); dirty = null; commit(); }
function onStory(){
  tickEls.forEach((b, i) => b.classList.toggle('on', i === si));
  shelfItems.forEach((li, i) => li.classList.toggle('here', i === si));
  buildPips(STORIES[si].pages.length);
  markPips(clamp(Math.round(P[si]), 0, STORIES[si].pages.length - 1));
}
function markPips(f){ pipEls.forEach((b, i) => b.classList.toggle('on', i <= f)); }

/* ---------- the spring that catches what you let go of ---------- */
const STIFF = 210, DAMP = 29.5;         // critically damped: brisk, and it never overshoots
let anims = [], raf = 0, last = 0;
function spring(ax, target, v0, done){
  anims = anims.filter(a => a.ax.key !== ax.key);
  anims.push({ ax, target, v: v0 || 0, done });
  if (!raf){ last = performance.now(); raf = requestAnimationFrame(tick); }
}
function tick(now){
  const dt = clamp((now - last) / 1000, .001, .032); last = now;
  anims = anims.filter(a => {
    let x = a.ax.get();
    a.v += (-STIFF * (x - a.target) - DAMP * a.v) * dt;
    x += a.v * dt;
    if (Math.abs(x - a.target) < .0006 && Math.abs(a.v) < .02){
      a.ax.set(a.target); a.done && a.done(); return false;
    }
    a.ax.set(x); return true;
  });
  commit();
  raf = anims.length ? requestAnimationFrame(tick) : 0;
}
function stopAnims(){ anims = []; if (raf){ cancelAnimationFrame(raf); raf = 0; } }

function finish(ax, moved){
  if (ax.key === 'page'){ warmLeaf = null; dirty = ax.story; commit(); }
  if (moved) hints.classList.remove('on');
  idleHide();
  prepare();
}
/* After you land, and once the page has settled, get the page ahead and the
   page behind ready to bend. Everything else gives its strips back. */
let prepT = 0;
function prepare(){
  if (reduce || !said) return;
  clearTimeout(prepT);
  prepT = setTimeout(() => (window.requestIdleCallback || setTimeout)(() => {
    if (g || w || anims.length){ prepare(); return; }
    const lv = STORIES[si]._leaves, f = clamp(Math.round(P[si]), 0, lv.length - 1);
    const want = new Map();
    if (f < lv.length - 1) want.set(lv[f], 1);        // the page you would turn
    if (f > 0) want.set(lv[f - 1], -1);               // the page you would pull back
    STORIES.forEach(s => s._leaves.forEach(lf => {
      if (lf._curl && !lf._curl.live && !want.has(lf)) dropCurl(lf); }));
    want.forEach((dir, lf) => { if (!lf._curl){ lf._dir = dir; buildCurl(lf); } });
  }), 700);
}
/* Where it lands: a third of the way over, or a flick fast enough to carry it
   there, commits. Momentum counts, so a short fast flick turns the page and a
   long slow drag let go early falls back. Never more than one step per
   gesture — you cannot turn two leaves with one thumb. */
const COMMIT = .3, CARRY = .22;
function settle(ax, v, from){
  const proj = ax.get() + v * CARRY;
  let t = proj > from + COMMIT ? from + 1 : proj < from - COMMIT ? from - 1 : from;
  t = clamp(t, ax.lo(), ax.hi());
  spring(ax, t, v, () => finish(ax, t !== from));
}
function step(key, d, after){
  wake(); stopAnims();
  const ax = axis(key), from = Math.round(ax.get());
  const t = clamp(from + d, ax.lo(), ax.hi());
  if (key === 'page' && t !== from) warmFor(d);
  spring(ax, t, 0, () => { finish(ax, t !== from); after && after(); });
}
function goTo(i){
  wake(); stopAnims();
  spring(MENU_AXIS, 0, 0, () => finish(MENU_AXIS, true));
  spring(STORY_AXIS, clamp(i, 0, N - 1), 0, () => finish(STORY_AXIS, true));
  shell.focus({ preventScroll: true });
}
/* build the strips before the paper is asked to bend, so the first frame of a
   turn is not the frame that clones the page */
function warmFor(dir){
  const lv = STORIES[si]._leaves, p = P[si];
  const j = dir > 0 ? Math.floor(p + 1e-6) : Math.ceil(p - 1e-6) - 1;
  warmLeaf = lv[j] || null;
  if (!warmLeaf) return;
  // only a leaf at rest takes a new direction; one caught mid-fall keeps its shape
  if (!(warmLeaf._p > 0 && warmLeaf._p < 1)) warmLeaf._dir = dir;
  dirty = si; commit();
}

/* ---------- the drag ---------- */
function vel(s){
  if (s.length < 2) return 0;
  const a = s[0], b = s[s.length - 1], dt = (b[0] - a[0]) / 1000;
  return dt > .008 ? clamp((b[1] - a[1]) / dt, -14, 14) : 0;
}
let g = null;
shell.addEventListener('pointerdown', e => {
  if (e.target.closest('a')) return;
  wake(); stopAnims();
  g = { id: e.pointerId, x0: e.clientX, y0: e.clientY, axis: null, key: null, base: 0, from: 0, s: [] };
});
shell.addEventListener('pointermove', e => {
  if (!g || e.pointerId !== g.id) return;
  if (!g.axis){
    const dx = e.clientX - g.x0, dy = e.clientY - g.y0;
    if (Math.abs(dx) < 8 && Math.abs(dy) < 8) return;
    g.axis = Math.abs(dx) > Math.abs(dy) ? 'x' : 'y';
    if (g.axis === 'x'){
      const back = Math.sign(dx) !== FWD_DX;
      // dragging back from the first page does not rubber-band: it pulls the index out
      g.key = (V.mx > .001 || (back && P[si] <= .001)) ? 'menu' : 'page';
      if (g.key === 'page') warmFor(back ? -1 : 1);
    } else g.key = V.mx > .001 ? null : 'story';
    if (!g.key){ g = null; return; }
    try { shell.setPointerCapture(e.pointerId); g.held = true; } catch (_) {}
    g.ax = axis(g.key);
    g.base = g.ax.get();
    g.from = Math.round(g.base);
    g.x0 = e.clientX; g.y0 = e.clientY;      // drop the 8px of slop
    return;
  }
  const ax = g.ax;
  const dx = e.clientX - g.x0, dy = e.clientY - g.y0;
  const raw = g.key === 'page' ? g.base + FWD_DX * dx / W()
            : g.key === 'menu' ? g.base - FWD_DX * dx / MENU()
            : g.base - dy / H();
  ax.set(bounded(ax, raw));
  g.s.push([e.timeStamp, ax.get()]);
  while (g.s.length > 2 && e.timeStamp - g.s[0][0] > 90) g.s.shift();
  soon();
});
function release(e){
  if (!g || (e && e.pointerId !== g.id)) return;
  if (g.held) try { shell.releasePointerCapture(g.id); } catch (_) {}
  const { ax, from, s } = g; g = null;
  if (ax) settle(ax, vel(s), from);
}
shell.addEventListener('dragstart', e => e.preventDefault());
shell.addEventListener('touchmove', e => e.preventDefault(), { passive: false });
shell.addEventListener('pointerup', release);
shell.addEventListener('pointercancel', release);

/* ---------- trackpad and wheel, on the same axes as a finger ----------
   Wheel deltas run opposite to finger movement, so the signs are flipped
   against the drag above. A plain mouse wheel only has one axis, which is
   why the page corner and the arrow keys exist. */
let w = null, wT = 0;
shell.addEventListener('wheel', e => {
  if (e.ctrlKey) return;                       // pinch zoom
  e.preventDefault(); wake();
  const k = e.deltaMode === 1 ? 16 : e.deltaMode === 2 ? H() : 1;
  const dx = e.deltaX * k * 2.2, dy = e.deltaY * k * 2.2;
  if (!w){
    stopAnims();
    let key;
    if (Math.abs(dx) > Math.abs(dy)){
      const back = Math.sign(dx) === FWD_DX;
      key = (V.mx > .001 || (back && P[si] <= .001)) ? 'menu' : 'page';
      if (key === 'page') warmFor(back ? -1 : 1);
    } else key = V.mx > .001 ? 'menu' : 'story';
    const ax = axis(key);
    w = { key, ax, raw: ax.get(), from: Math.round(ax.get()), s: [] };
  }
  const ax = w.ax;
  w.raw += w.key === 'page' ? -FWD_DX * dx / W()
         : w.key === 'menu' ? FWD_DX * dx / MENU() - dy / MENU()
         : dy / H();
  ax.set(bounded(ax, w.raw));
  w.s.push([e.timeStamp, ax.get()]);
  while (w.s.length > 2 && e.timeStamp - w.s[0][0] > 90) w.s.shift();
  soon();
  clearTimeout(wT);
  wT = setTimeout(() => { const q = w; w = null; settle(q.ax, vel(q.s), q.from); }, 90);
}, { passive: false });

/* ---------- keys ---------- */
addEventListener('keydown', e => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (/^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement && document.activeElement.tagName || '')) return;
  const open = V.mx > .5, k = e.key;
  if (open){
    if (k === 'Escape' || k === (FWD_DX < 0 ? 'ArrowRight' : 'ArrowLeft')){
      e.preventDefault(); step('menu', -1, () => shell.focus({ preventScroll: true }));
    }
    return;                                     // Tab and Enter belong to the list
  }
  if (k === 'ArrowRight' || k === 'PageDown' || k === ' '){ e.preventDefault(); step('page', 1); }
  else if (k === 'ArrowLeft' || k === 'PageUp'){
    e.preventDefault();
    if (P[si] <= .001) step('menu', 1, () => shelfItems[si].firstChild.focus());
    else step('page', -1);
  }
  else if (k === 'ArrowDown'){ e.preventDefault(); step('story', 1); }
  else if (k === 'ArrowUp'){ e.preventDefault(); step('story', -1); }
});

/* ---------- the pen: the one drawing on page 190 ---------- */
const leaf0 = STORIES[0]._leaves[0];
const svg = leaf0.querySelector('#ink'), note = leaf0.querySelector('#note'),
      intro = leaf0.querySelector('#intro'), hints = $('#hints');
let seed = 7;
const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
const rel = e => { const a = e.getBoundingClientRect(), b = leaf0.getBoundingClientRect();
  return { x: a.left - b.left, y: a.top - b.top, w: a.width, h: a.height }; };
const tbox = () => leaf0.querySelector('.text');
const textRight = () => rel(tbox()).x + tbox().offsetWidth;
const arrowHead = (x1, y1, cx, cy) => { const a = Math.atan2(y1 - cy, x1 - cx), L = 9, sp = .5;
  return `M${(x1 - L*Math.cos(a - sp)).toFixed(1)} ${(y1 - L*Math.sin(a - sp)).toFixed(1)} L${x1.toFixed(1)} ${y1.toFixed(1)} L${(x1 - L*Math.cos(a + sp)).toFixed(1)} ${(y1 - L*Math.sin(a + sp)).toFixed(1)}`; };
const shapes = {
  circle(){
    const r = rel($('#w-alex')), cx = r.x + r.w/2, cy = r.y + r.h/2, rx = r.w/2 + 9, ry = r.h/2 + 4;
    let d = "";
    for (let i = 0; i <= 52; i++){ const t = -2.2 + i/48*Math.PI*2, j = 1 + (rnd() - .5)*.06;
      d += (i ? " L" : "M") + (cx + Math.cos(t)*rx*j).toFixed(1) + " " + (cy + Math.sin(t)*ry*j).toFixed(1); }
    return [d];
  },
  arrow(){
    const a = rel($('#w-alex')), n = rel(note);
    if (!wide()){
      const wf = rel($('#w-wife')), ex = a.x + a.w + 14, ey = a.y + a.h + 2, x0 = n.x - 6, y0 = n.y + n.h*.45;
      const x1 = Math.min(Math.max(ex, wf.x + wf.w + 18), x0 - 28), y1 = Math.max(ey, wf.y + wf.h*.35),
            c2x = x1 + 18, c2y = y1 + 18;
      return [`M${x0} ${y0} C${x0 - 26} ${y0 + 2}, ${c2x} ${c2y}, ${x1} ${y1}`, arrowHead(x1, y1, c2x, c2y)];
    }
    const x0 = a.x + a.w + 14, y0 = a.y + a.h/2, x1 = n.x - 8, y1 = n.y + n.h*.55, c2x = x1 - 50, c2y = y1 + 8;
    return [`M${x0} ${y0} C${x0 + 40} ${y0 + 14}, ${c2x} ${c2y}, ${x1} ${y1}`, arrowHead(x1, y1, c2x, c2y)];
  }
};
const drawn = [];
function render(name, animate, dur, delay = 0){
  shapes[name]().forEach((d, i, ds) => {
    const p = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    p.setAttribute('d', d);
    svg.append(p);
    if (animate && !reduce){
      const len = p.getTotalLength();
      p.style.strokeDasharray = len; p.style.strokeDashoffset = len;
      p.getBoundingClientRect();
      p.style.transition = `stroke-dashoffset ${dur/ds.length}ms ease-out ${delay + i*dur/ds.length}ms`;
      p.style.strokeDashoffset = 0;
    }
  });
}
function placeNote(){
  if (!wide()){
    const y = rel($('#w-yes'));
    note.style.left = (textRight() - note.offsetWidth - 6) + 'px';
    note.style.top = (y.y - 2) + 'px';
    return;
  }
  const t = rel($('#w-alex'));
  note.style.left = (textRight() + 48) + 'px';
  note.style.top = (t.y + parseFloat(note.dataset.dy) * 16) + 'px';
}
function layout(){ svg.innerHTML = ''; seed = 7; placeNote(); drawn.forEach(s => render(s, false)); }

/* ---------- the opening: this is me, then who I am, then how to move ---------- */
let noted = false, said = false;
function showNote(){
  if (noted) return; noted = true;
  placeNote(); drawn.push('circle', 'arrow');
  render('circle', true, 450); render('arrow', true, 300, 450);
  setTimeout(() => note.classList.add('on'), reduce ? 0 : 700);
}
function showIntro(){
  if (said) return; said = true;
  intro.classList.add('said');
  setTimeout(() => {
    document.body.classList.add('ready');
    if (si === 0 && P[0] < .5) hints.classList.add('on');
    prepare();
  }, reduce ? 0 : 750);
}
const NOTE_HELD = 1600;
function openingBeat(){ showNote(); setTimeout(showIntro, reduce ? 0 : NOTE_HELD); }

let idleT = 0;
function wake(){
  ticks.classList.add('on'); pips.classList.add('on');
  clearTimeout(idleT);
  if (!noted) showNote();               // touched it early? catch the opening up
  if (!said) showIntro();
}
function idleHide(){
  clearTimeout(idleT);
  idleT = setTimeout(() => { ticks.classList.remove('on'); pips.classList.remove('on'); }, 1400);
}

const verb = coarse ? 'swipe' : 'drag';
hints.innerHTML =
  `<div><i>${FWD_DX < 0 ? '←' : '→'}</i><span>${verb} to keep reading</span></div>` +
  `<div><i>↑</i><span>${verb} up for another story</span></div>` +
  `<div><i>${FWD_DX < 0 ? '→' : '←'}</i><span>${verb} back for the index</span></div>`;

addEventListener('resize', () => {
  clearTimeout(layout.t);
  layout.t = setTimeout(() => {
    layout();
    warmLeaf = null;
    STORIES.forEach(s => s._leaves.forEach(lf => {
      dropCurl(lf); lf._p = undefined; lf._keep = undefined; }));
    commitAll();
    prepare();
  }, 140);
});

shell.tabIndex = -1;
onStory(); commitAll();
document.fonts.ready.then(() => {
  layout(); commitAll();
  setTimeout(openingBeat, reduce ? 0 : 800);
});
})();
</script>
</body>
</html>
