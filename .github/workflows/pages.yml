name: Deploy site to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      # Pages lets a browser keep each file for ten minutes, on its own
      # clock, so a visitor could get this deploy's page with the last one's
      # script. The script's address changes with every deploy instead.
      - name: Stamp the script with this commit
        run: sed -i "s|src=\"app.js\"|src=\"app.js?v=${GITHUB_SHA::8}\"|" site/index.html
      # The blog, from the Markdown in blog/, under /blog/ for now. Its own
      # domain comes later: then it is built with --base / on its own.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the blog
        run: |
          pip install pillow
          python3 blog/build.py --out site/blog --base /blog/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
